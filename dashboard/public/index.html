<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEMSHARKS SEO Autopilot</title>

<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--APP-START-->
<div class="app">

    <nav id="nav" aria-label="Sections">
      <div class="nav-sec">Cockpit</div>
      <a href="#overview" data-route="overview"><span class="ic">◧</span>Overview</a>
      <a href="#approvals" data-route="approvals"><span class="ic">✓</span>Approvals<span class="nav-badge" id="nav-approvals"></span></a>
      <a href="#activity" data-route="activity"><span class="ic">≡</span>Agent Activity</a>
      <div class="nav-sec">Search</div>
      <a href="#performance" data-route="performance"><span class="ic">↗</span>Performance (GSC)</a>
      <a href="#funnel" data-route="funnel"><span class="ic">⇣</span>Search → Business</a>
      <a href="#opportunities" data-route="opportunities"><span class="ic">◎</span>Opportunities</a>

      <div class="nav-sec">System</div>
      <a href="#sources" data-route="sources"><span class="ic">⛁</span>Data Sources</a>
    </nav>
    <div class="client-box">
      <div class="label">Client</div>
      <select id="client-switch" aria-label="Client"></select>
      <div class="client-region" id="client-region"></div>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-right" id="topbar-right"></div>
    </header>
    <div class="content" id="view"><div class="loading">Loading dashboard data…</div></div>
  </main>
</div>
<div class="tooltip" id="tooltip" role="tooltip"></div>
<!--APP-END-->
<script src="app.js"></script>
